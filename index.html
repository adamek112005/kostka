<!DOCTYPE html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GAN Cube Lab</title>
<style>
:root{--bg:#f6f6f3;--fg:#1c1c1a;--card:#fff;--mut:#6b6b66;--acc:#2563eb;--ok:#16a34a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121214;--fg:#ececea;--card:#1d1d20;--mut:#9a9a94;--acc:#60a5fa;--ok:#4ade80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121214;--fg:#ececea;--card:#1d1d20;--mut:#9a9a94;--acc:#60a5fa;--ok:#4ade80;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif;max-width:560px;margin:auto;padding:12px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--acc);color:#fff}
button.s{background:transparent;color:var(--fg);border:1px solid var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#time{font:700 56px ui-monospace,monospace;text-align:center}
#scr{font:600 18px ui-monospace,monospace;text-align:center;line-height:1.6}
#st,.mut{color:var(--mut);font-size:14px}
#pl{display:flex;justify-content:center;min-height:240px}
#log{font:13px ui-monospace,monospace;max-height:160px;overflow:auto;overflow-wrap:anywhere}
</style></head><body>
<div class="card"><div class="row"><button id="con">Połącz kostkę</button><button class="s" id="vis">Widok: 3D</button><span id="st">Nie połączono</span></div></div>
<div class="card"><div id="pl"></div></div>
<div class="card"><div id="scr">–</div><div id="time">0.00</div>
<div class="row" style="justify-content:center"><button id="sc">Nowy scramble</button><button id="go" class="s">Gotowy</button></div>
<p class="mut" id="hint" style="text-align:center">Wygeneruj scramble, wykonaj go na kostce, kliknij „Gotowy”. Timer ruszy przy pierwszym ruchu i stanie po ułożeniu.</p></div>
<div class="card"><b>Ruchy</b> <span class="mut" id="cnt"></span><div id="log"></div>
<div class="row" style="margin-top:8px"><button class="s" id="cp">Kopiuj</button><button class="s" id="rs">Reset modelu</button></div></div>
<div class="card"><b>Historia</b><div id="hist" class="mut">brak</div></div>
<script type="module">
import {TwistyPlayer} from "https://cdn.jsdelivr.net/npm/cubing@0.52.2/twisty/+esm";
import {connectSmartPuzzle} from "https://cdn.jsdelivr.net/npm/cubing@0.52.2/bluetooth/+esm";
const $=id=>document.getElementById(id);
let mode="3D";
const mk=()=>{$("pl").innerHTML="";const p=new TwistyPlayer({puzzle:"3x3x3",visualization:mode,controlPanel:"none",background:"none"});$("pl").append(p);return p};
let player=mk(),puzzle=null,state="idle",t0=0,raf=0,moves=[],solves=[];
try{solves=JSON.parse(localStorage.getItem("solves")||"[]")}catch(e){}
const fmt=ms=>(ms/1000).toFixed(2);
function drawHist(){$("hist").innerHTML=solves.length?solves.slice(-8).reverse().map(s=>fmt(s.ms)+" s · "+s.n+" ruchów").join("<br>"):"brak"}
drawHist();
$("vis").onclick=()=>{mode=mode==="3D"?"2D":"3D";$("vis").textContent="Widok: "+mode;player=mk()};
$("rs").onclick=()=>{player=mk()};
$("sc").onclick=()=>{
 const F="UDLRFB",M=["","'","2"];let a=-1,o=[];
 while(o.length<20){const f=Math.floor(Math.random()*6),x=f>>1;if(x===a)continue;a=x;o.push(F[f]+M[Math.floor(Math.random()*3)])}
 $("scr").textContent=o.join(" ");state="idle";cancelAnimationFrame(raf);$("time").textContent="0.00";
};
$("go").onclick=()=>{moves=[];$("log").textContent="";$("cnt").textContent="";state="ready";$("hint").textContent="Gotowy – zrób pierwszy ruch, żeby ruszyć timer."};
function tick(){$("time").textContent=fmt(performance.now()-t0);raf=requestAnimationFrame(tick)}
function onMove(m){
 player.experimentalAddMove(m,{cancel:false});
 if(state==="ready"){state="run";t0=performance.now();moves=[];tick()}
 if(state==="run"){moves.push({t:Math.round(performance.now()-t0),m:m.toString()});
  $("log").textContent=moves.map(x=>x.m+"("+fmt(x.t)+")").join(" ");$("cnt").textContent=moves.length}
}
function onPattern(p){
 if(state!=="run"||moves.length<3)return;
 let ok=false;try{ok=p.experimentalIsSolved({ignorePuzzleOrientation:true,ignoreCenterOrientation:true})}catch(e){}
 if(ok){const ms=performance.now()-t0;state="done";cancelAnimationFrame(raf);$("time").textContent=fmt(ms);
  $("time").style.color="var(--ok)";setTimeout(()=>$("time").style.color="",1500);
  solves.push({ms,n:moves.length});try{localStorage.setItem("solves",JSON.stringify(solves))}catch(e){}drawHist()}
}
$("con").onclick=async()=>{
 if(puzzle){puzzle.disconnect();puzzle=null;$("con").textContent="Połącz kostkę";$("st").textContent="Rozłączono";return}
 try{
  $("st").textContent="Łączenie…";
  puzzle=await connectSmartPuzzle();
  puzzle.addAlgLeafListener(e=>{if(e.latestAlgLeaf)onMove(e.latestAlgLeaf)});
  puzzle.addPatternListener(e=>onPattern(e.pattern));
  $("con").textContent="Rozłącz";$("st").textContent="Połączono";
 }catch(err){puzzle=null;$("st").textContent="Błąd: "+(err&&err.message||err)}
};
$("cp").onclick=()=>{const t=moves.map(x=>x.m).join(" ");try{navigator.clipboard.writeText(t);$("cp").textContent="Skopiowano"}catch(e){$("cp").textContent="Nie można"};setTimeout(()=>$("cp").textContent="Kopiuj",1200)};
</script></body></html>
